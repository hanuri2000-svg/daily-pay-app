name: Deploy v5.6.2 settlement image refresh

on:
  push:
    paths:
      - '.github/workflows/deploy-v562.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v5.6.2 patch
        run: python .github/scripts/patch_v562.py

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/app.js').write_text('\n'.join(s for s in scripts if s.strip()),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check service-worker.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update 라비c공수 Pro to v5.6.2"
          git push
