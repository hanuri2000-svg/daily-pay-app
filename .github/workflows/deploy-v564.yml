name: Deploy v5.6.4 settlement and preview update

on:
  push:
    paths:
      - '.github/workflows/deploy-v564.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v5.6.4 update
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload = ''''''
          open('/tmp/v564.patch','wb').write(zlib.decompress(base64.b64decode(payload)))
          PY
          patch index.html < /tmp/v564.patch
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          Path('version.json').write_text(json.dumps({
              'version':'5.6.4',
              'message':'월간 정산서 PNG를 더 고급스럽고 보기 편한 제출용 스타일로 리뉴얼하고, 모바일 PNG 미리보기와 닫기 동작을 개선했습니다.'
          }, ensure_ascii=False, indent=2)+"\n", encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          sw=sw.replace('rabic-gongsu-pro-v5-6-2','rabic-gongsu-pro-v5-6-4')
          Path('service-worker.js').write_text(sw, encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'v5.6.4' in html
          assert 'pngImageOnlyLayer' in html
          assert '이미지만 크게 보기' in html
          assert '상대방이 보기 편한 정산서 이미지' in html
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "hanuri2000-svg"
          git config user.email "hanuri2000@naver.com"
          git add index.html version.json service-worker.js
          git commit -m "Deploy v5.6.4 directly"
          git push
