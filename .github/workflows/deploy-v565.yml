name: Deploy v5.6.5 settlement cleanup

on:
  push:
    paths:
      - '.github/workflows/deploy-v565.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v5.6.5 update
        run: python .github/scripts/patch_v565.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(m),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit update
        run: |
          git config user.name "hanuri2000-svg"
          git config user.email "hanuri2000@naver.com"
          git add index.html version.json service-worker.js
          git commit -m "Update to v5.6.5 settlement cleanup" || exit 0
          git push
