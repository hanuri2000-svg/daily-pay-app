<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b6d">
<title>현장 공수관리 Pro</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#18212f;--muted:#6f7b8c;--primary:#173b6d;--line:#dde5ef;--danger:#c93636;--shadow:0 8px 25px rgba(20,45,80,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--primary);color:#fff}.soft{background:#edf3fb;color:var(--primary)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger)}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;outline:none}select:focus,input:focus,textarea:focus{border-color:#7da4d7;box-shadow:0 0 0 3px rgba(36,93,168,.1)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.metric strong{font-size:23px}.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:98px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;text-align:left}.day.empty{background:transparent;border-color:transparent}.day.today{outline:2px solid #eeb94d}.num{font-weight:800;font-size:13px}.sun .num{color:#c94b4b}.sat .num{color:#2b63a9}.badge{margin-top:8px;border-radius:10px;padding:7px;color:#fff;font-size:12px}.badge small{display:block;opacity:.9;margin-top:2px}.page{display:none}.page.active{display:block}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(980px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav{border:0;background:transparent;color:var(--muted);padding:9px;font-size:12px}.nav.active{color:var(--primary);font-weight:800}.modal{position:fixed;inset:0;background:rgba(15,25,40,.48);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheethead h2{margin:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px}.muted{color:var(--muted)}.small{font-size:12px}.reportwrap{overflow:auto}.report{min-width:720px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.summary div{background:#f4f7fb;border-radius:12px;padding:14px}.summary span{display:block;color:var(--muted);font-size:12px}.summary strong{display:block;margin-top:5px;font-size:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}th:first-child,td:first-child{text-align:left}.notice{background:#fff8df;border:1px solid #f0db87;border-radius:12px;padding:12px;color:#6f5814}.right{text-align:right}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.day{min-height:76px;padding:6px}.badge{padding:5px;font-size:10px}.badge small{display:none}.form{grid-template-columns:1fr}.full{grid-column:auto}.top h1{font-size:21px}}
</style>

<style id="iphone-v11-fix">
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,select,input,textarea{min-width:0}
.cal-head,.cal{grid-template-columns:repeat(7,minmax(0,1fr));width:100%}
.day{width:100%;min-width:0;overflow:hidden}
.reportwrap{overflow-x:hidden}
@media(max-width:760px){
  .app{width:100%;max-width:100%;padding:10px 10px 96px}
  .top{align-items:flex-start;margin-bottom:10px}
  .top p{display:none}
  .top h1{font-size:20px;line-height:1.2}
  .top>.btn,.top>button{padding:9px 11px;font-size:12px;white-space:nowrap}
  .card{padding:12px;border-radius:15px}
  .toolbar{display:grid;grid-template-columns:1fr;width:100%;gap:9px}
  .toolbar>.group{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:7px}
  .toolbar>.group:last-child{grid-template-columns:1fr auto}
  .toolbar select{width:100%;min-width:0!important}
  .btn{padding:10px 11px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
  .metric{padding:12px 10px;min-width:0}
  .metric span{font-size:11px;margin-bottom:5px}
  .metric strong{font-size:18px;line-height:1.15;white-space:nowrap;letter-spacing:-.5px}
  .cal-head,.cal{gap:3px}
  .cal-head div{padding:5px 0;font-size:11px}
  .day{min-height:66px;border-radius:10px;padding:5px 4px}
  .num{font-size:12px}
  .badge{margin-top:5px;border-radius:7px;padding:4px 2px;font-size:9px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge small{display:none}
  .bottom{width:100%;padding:6px 5px calc(6px + env(safe-area-inset-bottom))}
  .nav{padding:8px 2px;font-size:11px;min-width:0}
  .modal{padding:0;align-items:flex-end}
  .sheet{width:100%;max-width:100%;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:92vh}
  .sheethead h2{font-size:18px}
  .form{grid-template-columns:1fr;gap:10px}
  .full{grid-column:auto}
  .actions{position:sticky;bottom:0;background:#fff;padding-top:10px;margin-top:10px}
  .actions .btn{flex:1}
  .row{padding:11px;min-width:0}
  .row>div{min-width:0}
  .row strong,.row .small{overflow-wrap:anywhere}
  .reportwrap{padding:8px!important;overflow:hidden}
  .report{min-width:0!important;width:100%;max-width:100%;padding:14px 10px;border-radius:12px;overflow:hidden}
  .report>div:first-child{gap:8px!important}
  .report h2{font-size:18px;overflow-wrap:anywhere}
  .report .summary,.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0}
  .summary div{padding:10px 8px;min-width:0}
  .summary span{font-size:10px}.summary strong{font-size:15px;white-space:nowrap}
  .report table{table-layout:fixed;width:100%}
  .report th,.report td{padding:7px 3px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .report th:nth-child(5),.report td:nth-child(5){display:none}
  .report th:nth-child(1),.report td:nth-child(1){width:31%}
  .report th:nth-child(2),.report td:nth-child(2){width:13%}
  .report th:nth-child(3),.report td:nth-child(3){width:27%}
  .report th:nth-child(4),.report td:nth-child(4){width:29%}
  .report [style*="width:360px"]{width:100%!important;max-width:100%!important}
  .report [style*="grid-template-columns:repeat(7,1fr)"]{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:2px!important}
  .report [style*="min-height:54px"]{min-height:42px!important;padding:3px!important;font-size:9px!important}
  .report [style*="margin-top:5px"]{font-size:8px!important;padding:3px 1px!important;white-space:nowrap;overflow:hidden}
}
@media(max-width:390px){
  .metric strong{font-size:16px}
  .day{min-height:61px}
  .badge{font-size:8px}
}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>현장 공수관리 Pro</h1><p>업체별 공수·일당·정산 관리</p></div><button id="quickBackup" class="btn ghost">백업</button></header>
<section id="home" class="page active">
<div class="card toolbar"><div class="group"><button id="prev" class="btn ghost">‹</button><strong id="monthTitle"></strong><button id="next" class="btn ghost">›</button></div><div class="group"><select id="companySelect" style="min-width:180px"></select><button id="today" class="btn soft">오늘</button></div></div>
<div class="metrics"><div class="card metric"><span>출근일수</span><strong id="days">0일</strong></div><div class="card metric"><span>총 공수</span><strong id="units">0공수</strong></div><div class="card metric"><span>총액</span><strong id="gross">0원</strong></div><div class="card metric"><span>예상 실수령</span><strong id="net">0원</strong></div></div>
<div class="card"><div class="cal-head"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="calendar" class="cal"></div></div>
</section>
<section id="reportPage" class="page"><div class="card toolbar"><div><strong>월간 정산서</strong> <span id="reportPeriod" class="muted"></span></div><div class="group"><button id="png" class="btn soft">PNG 저장</button><button id="print" class="btn primary">PDF / 인쇄</button></div></div><div class="card reportwrap" style="margin-top:14px"><div id="report" class="report"></div></div></section>
<section id="companies" class="page"><div class="card"><div class="toolbar"><h2 style="margin:0">업체 관리</h2><button id="addCompany" class="btn primary">업체 추가</button></div><div id="companyList" class="list" style="margin-top:14px"></div></div></section>
<section id="settings" class="page"><div class="card"><h2 style="margin-top:0">설정</h2><div class="form"><div class="field"><label>근무자 이름</label><input id="workerName"></div><div class="field"><label>연락처(선택)</label><input id="workerPhone"></div><div class="field full"><label>정산서 메모</label><textarea id="reportMemo" rows="3"></textarea></div></div><div class="actions"><button id="saveSettings" class="btn primary">설정 저장</button></div></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">백업 / 복원</h2><p class="muted small">데이터는 현재 브라우저에 저장됩니다. 기기 변경 전 반드시 JSON 백업을 보관하세요.</p><div class="group"><button id="export" class="btn soft">JSON 백업</button><label class="btn ghost">JSON 복원<input id="importFile" type="file" accept="application/json" hidden></label><button id="reset" class="btn danger">전체 초기화</button></div></div></section>
</div>
<nav class="bottom"><button class="nav active" data-page="home">📅<br>달력</button><button class="nav" data-page="reportPage">🧾<br>정산</button><button class="nav" data-page="companies">🏢<br>업체</button><button class="nav" data-page="settings">⚙️<br>설정</button></nav>
<div id="entryModal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="entryTitle">근무 입력</h2><button class="btn ghost" data-close="entryModal">닫기</button></div><div class="form"><div class="field"><label>업체</label><select id="entryCompany"></select></div><div class="field"><label>공수</label><select id="entryUnits"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option></select></div><div class="field"><label>일당</label><input id="entryRate" type="number" min="0" step="1000"></div><div class="field"><label>작업 구분</label><select id="entryType"><option value="normal">일반</option><option value="night">야간</option><option value="overtime">연장</option><option value="holiday">휴일</option></select></div><div class="field full"><label>메모</label><textarea id="entryMemo" rows="3"></textarea></div></div><div class="actions"><button id="deleteEntry" class="btn danger">삭제</button><button id="saveEntry" class="btn primary">저장</button></div></div></div>
<div id="companyModal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="companyTitle">업체 추가</h2><button class="btn ghost" data-close="companyModal">닫기</button></div><div class="form"><div class="field"><label>업체명</label><input id="cName"></div><div class="field"><label>기본 일당</label><input id="cRate" type="number" min="0" step="1000"></div><div class="field"><label>대표 색상</label><input id="cColor" type="color" value="#245da8"></div><div class="field"><label>기본 공제율(%)</label><input id="cTax" type="number" min="0" max="100" step="0.1"></div><div class="field"><label>담당자</label><input id="cManager"></div><div class="field"><label>연락처</label><input id="cPhone"></div><div class="field full"><label>고정 공제액(월)</label><input id="cFixed" type="number" min="0" step="1000"></div><div class="field full"><label>메모</label><textarea id="cMemo" rows="3"></textarea></div></div><div class="actions"><button id="deleteCompany" class="btn danger">업체 삭제</button><button id="saveCompany" class="btn primary">저장</button></div></div></div>
<script>
(()=>{const KEY='work-ledger-pro-v1',clone=x=>JSON.parse(JSON.stringify(x)),won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),todayISO=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},base={version:1,settings:{workerName:'',workerPhone:'',reportMemo:''},companies:[{id:'default',name:'기본 업체',rate:180000,color:'#245da8',tax:3.3,fixed:0,manager:'',phone:'',memo:''}],entries:{}};let state=(()=>{try{return Object.assign(clone(base),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return clone(base)}})(),view=new Date();view.setDate(1);let selected='',editCid=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),cid=()=>$('#companySelect').value||state.companies[0]?.id,company=id=>state.companies.find(c=>c.id===id),mkey=()=>`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`,entries=(id=cid())=>Object.entries(state.entries).filter(([d,e])=>d.startsWith(mkey()+'-')&&e.companyId===id).sort((a,b)=>a[0].localeCompare(b[0])),calc=(id=cid())=>{const c=company(id)||{tax:0,fixed:0},list=entries(id),days=list.length,units=list.reduce((s,[,e])=>s+Number(e.units||0),0),gross=list.reduce((s,[,e])=>s+Number(e.units||0)*Number(e.rate||0),0),percent=Math.round(gross*Number(c.tax||0)/100),fixed=Number(c.fixed||0);return{list,days,units,gross,percent,fixed,net:gross-percent-fixed}};
function selects(){const o=state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),old=$('#companySelect').value;$('#companySelect').innerHTML=o;$('#entryCompany').innerHTML=o;if(state.companies.some(c=>c.id===old))$('#companySelect').value=old}
function render(){selects();$('#monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;$('#reportPeriod').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;calendar();metrics();companies();report();settings()}
function metrics(){const x=calc();$('#days').textContent=x.days+'일';$('#units').textContent=x.units+'공수';$('#gross').textContent=won(x.gross);$('#net').textContent=won(x.net)}
function calendar(){const w=$('#calendar');w.innerHTML='';const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';w.append(e)}for(let d=1;d<=last;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dt=new Date(y,m,d),e=state.entries[iso],b=document.createElement('button');b.className='day '+(dt.getDay()===0?'sun ':'')+(dt.getDay()===6?'sat ':'')+(iso===todayISO()?'today ':'');b.innerHTML=`<div class="num">${d}</div>`;if(e){const c=company(e.companyId)||{name:'삭제된 업체',color:'#777'},icon={normal:'',night:' 🌙',overtime:' ⏱',holiday:' ★'}[e.type]||'';b.innerHTML+=`<div class="badge" style="background:${c.color}"><b>${e.units}공수${icon}</b><small>${esc(c.name)}</small></div>`}b.onclick=()=>openEntry(iso);w.append(b)}}
function companies(){const w=$('#companyList');w.innerHTML=state.companies.map(c=>`<div class="row"><div><strong><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</strong><div class="muted small">기본 일당 ${won(c.rate)} · 공제 ${c.tax||0}%${c.fixed?` + ${won(c.fixed)}`:''}</div></div><button class="btn ghost" data-edit="${c.id}">수정</button></div>`).join('');$$('[data-edit]').forEach(b=>b.onclick=()=>openCompany(b.dataset.edit))}
function reportCalendar(id){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=last;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=state.entries[iso],ok=e&&e.companyId===id;cells+=`<div style="min-height:54px;border:1px solid #dde5ef;border-radius:9px;padding:6px;font-size:11px"><b>${d}</b>${ok?`<div style="margin-top:5px;background:#173b6d;color:#fff;border-radius:7px;padding:4px">${e.units}공수</div>`:''}</div>`}return`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${['일','월','화','수','목','금','토'].map(x=>`<div style="text-align:center;color:#6f7b8c;font-size:11px">${x}</div>`).join('')}${cells}</div>`}
function report(){const id=cid(),c=company(id),x=calc(id);if(!c){$('#report').innerHTML='<p>업체를 먼저 등록하세요.</p>';return}const rows=x.list.map(([d,e])=>`<tr><td>${d}</td><td>${e.units}</td><td>${won(e.rate)}</td><td>${won(e.units*e.rate)}</td><td>${esc(e.memo||'')}</td></tr>`).join('');$('#report').innerHTML=`<div style="display:flex;justify-content:space-between;gap:20px"><div><h2 style="margin:0">${esc(c.name)} 공수 정산서</h2><div class="muted">${view.getFullYear()}년 ${view.getMonth()+1}월</div></div><div class="right"><b>${esc(state.settings.workerName||'근무자 미입력')}</b><div class="muted small">${esc(state.settings.workerPhone||'')}</div></div></div><div style="margin-top:22px">${reportCalendar(id)}</div><div class="summary"><div><span>출근일수</span><strong>${x.days}일</strong></div><div><span>총 공수</span><strong>${x.units}공수</strong></div><div><span>총액</span><strong>${won(x.gross)}</strong></div><div><span>실수령</span><strong>${won(x.net)}</strong></div></div><table><thead><tr><th>날짜</th><th>공수</th><th>일당</th><th>금액</th><th>메모</th></tr></thead><tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:#6f7b8c">근무 기록이 없습니다.</td></tr>'}</tbody></table><div style="display:flex;justify-content:flex-end;margin-top:18px"><table style="width:360px"><tr><td>총액</td><td>${won(x.gross)}</td></tr><tr><td>공제 ${c.tax||0}%</td><td>- ${won(x.percent)}</td></tr><tr><td>고정 공제</td><td>- ${won(x.fixed)}</td></tr><tr><td><b>실수령액</b></td><td><b>${won(x.net)}</b></td></tr></table></div>${state.settings.reportMemo?`<div class="notice" style="margin-top:18px">${esc(state.settings.reportMemo)}</div>`:''}<div class="muted small right" style="margin-top:18px">생성일 ${todayISO()}</div>`}
function settings(){$('#workerName').value=state.settings.workerName||'';$('#workerPhone').value=state.settings.workerPhone||'';$('#reportMemo').value=state.settings.reportMemo||''}
